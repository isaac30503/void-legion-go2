# CI: the checks that need neither local.env nor the Release binaries (install/verify.sh --ci) and the
# automated tests (tests/run.sh), on every push and pull request. Actions pinned by commit and ShellCheck by
# version and checksum (the same 0.11.0 as on the machines), so a new release cannot change the result alone.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - name: Tools (fish 4, gettext, xmllint, ShellCheck 0.11.0)
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update -q
          sudo apt-get install -y -q fish gettext libxml2-utils
          curl -fsSLo /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/sc.tar.xz' | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp && sudo install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/
          shellcheck --version
      - name: Checks (install/verify.sh --ci)
        run: bash install/verify.sh --ci
      - name: Tests (tests/run.sh)
        run: bash tests/run.sh
