# mangowc's configuration for "Xfce (mango)" (~/.config/xfce4/mango/config.conf; installed by
# common/xfce-wayland/install-xfce-mango.sh; docs/5-desktop/5-mango.md). The same Xfce as "Xfce (Wayland)" (labwc),
# with mangowc placing the windows in Omarchy's two layouts, per workspace (Super+L): dwindle (each new window splits
# the focused one, right or down by its shape) and scroller (columns). Omarchy's keybindings
# (default/hypr/bindings/tiling.lua) where mango has the action. mangowc 0.18.3 (Void): its keywords are those of the
# config the package brings (/etc/mango/config.conf), not always those of the online docs (newer).
# Light on purpose (IdeaPad's HD 5500): no animations, blur, shadows or rounded corners.
# The installer replaces the keyboard below with the one in /etc/X11/xorg.conf.d/00-keyboard.conf (and adds the
# variant if there is one). Check after editing: mango -c <this file> -p.

# Effects, all off (scenefx draws nothing extra).
blur=0
blur_layer=0
shadows=0
layer_shadows=0
border_radius=0
dim_enable=0
focused_opacity=1.0
unfocused_opacity=1.0
animations=0
layer_animations=0

# Layouts: workspaces (tags) 1–9 start in dwindle; Super+L cycles dwindle ↔ scroller on the focused one.
circle_layout=dwindle,scroller
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle
tag_num=9

# Dwindle: the new window splits the focused one along its longer side, to the right or below (as Hyprland and
# sway's autotiling). preserve_split keeps what Super+J changed.
dwindle_smart_split=0
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1

# Scroller: every column at full width (the user's choice, 2026-10-23; it was 80 %, with the neighbour peeking in);
# Super+Shift+R cycles 50/80/100 %.
scroller_default_proportion=1.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0
scroller_focus_center=0
scroller_prefer_center=1

# Focus follows the mouse (as in labwc), and the pointer goes to the window focused with the keyboard.
sloppy_focus=1
warp_cursor=1
focus_on_activate=1

# Look: 8 px gaps (labwc's and window-snap's), 2 px border. Colors from the Super Game Bro theme of Omarchy
# (github.com/isaac30503/omarchy-super-game-bro-theme, colors.toml), as Omarchy themes Hyprland: active border =
# accent, inactive = Omarchy's rgba(595959aa). The states Hyprland lacks (shown only on the focused window) take
# the theme's other greens, darker steps than the accent so that they read apart from focus on a 2 px border:
# scratchpad = green, global (Super+O) = yellow, overlay = red; urgent and split, the brightest.
# mango hands the colors to scenefx as they are, and it blends them premultiplied: a translucent one must carry its
# RGB already multiplied by its alpha (rgba(595959aa) -> 3b3b3baa), or it washes out what is behind it.
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
smart_gaps=0
border_px=2
no_border_when_single=0
root_color=0x214130ff
border_color=0x3b3b3baa
focus_color=0xb8d432ff
maximized_screen_color=0xb8d432ff
urgent_color=0xd4f060ff
scratchpad_color=0x4a7828ff
global_color=0x648820ff
overlay_color=0x396840ff
split_color=0xd4f060ff
# Preview of where a dragged window will land: the accent at 9 %, premultiplied (mango's own was pinkish).
drop_color=0x11140518
# mango's own cursor: the desktop, the borders and the programs that ask it for a shape (cursor-shape: GTK, Firefox).
# env= below only reaches what mango starts; without this, mango drew its default one.
cursor_theme=volantes_cursors
cursor_size=24

# Keyboard (the installer writes X's: latam on the IdeaPad, us + intl on the Legion).
xkb_rules_layout=latam
repeat_rate=25
repeat_delay=600

# Trackpad, as the IdeaPad's in Xfce: tap to click.
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1

# mango would leave XDG_CURRENT_DESKTOP to its own value: Xfce's .desktop files (OnlyShowIn=XFCE: settings, task
# manager…) then vanish from the finder, the menu and the Docklike.
env=XDG_CURRENT_DESKTOP,XFCE
env=XCURSOR_THEME,volantes_cursors
env=XCURSOR_SIZE,24

# Xwayland stays up without X11 programs (labwc's xwaylandPersistence): otherwise it stops after a while and loses
# ~/.Xresources (xterm without its theme, seen on labwc on 2026-10-06).
xwayland_persistence=1

# xterm goes through Xwayland, which does not load ~/.Xresources by itself: without this, xterm comes out without the
# palette, the font or the copy/paste shortcuts. And xfdesktop's wallpaper again when the screens change.
exec_once=xrdb -nocpp -merge "$HOME/.Xresources"
exec_once=GDK_BACKEND=wayland exec "$HOME/.local/bin/wallpaper-watcher"

# The application finder floats, as in labwc.
window_rule=is_floating:1,app_id:xfce4-appfinder
# mango-scratchpad's list (Super+S with several windows there).
window_rule=is_floating:1,title:^mango-scratchpad$
# mango-keys' table of shortcuts (Super+K).
window_rule=is_floating:1,title:^mango-keys$
# Legion: the screen-share chooser (~/.local/bin/screen-share, docs/7-apps/1-screen-sharing.md) floats and stays on
# top, as in labwc: while it is open the portal attends no other request; without a border, so focus does not light
# it up (the user's choice, 2026-10-23). Harmless where there is none.
window_rule=is_floating:1,is_overlay:1,no_border:1,app_id:^screen-share$
# Steam's on-screen keyboard (X11, appid steam; its title follows Steam's language): Steam places it for a 1200 px
# tall screen, so on the Legion's 1080 px monitor 110 px were left out (2026-10-23). offsety:100 = at the bottom of
# the screen it opens on, centred and inside it; without a border, as in labwc (type="utility" rule).
window_rule=is_floating:1,no_border:1,offset_y:100,app_id:^steam$,title:^(Teclado en pantalla de Steam Input|Steam Input On-Screen Keyboard)$

# ---- Keybindings: Omarchy's (tiling.lua) and labwc's programs. Workspace numbers by keycode (code:10 = 1 … code:18
# = 9, as Omarchy does): they work with any keyboard layout, Shift included.

# Programs (the same commands as labwc's rc.xml).
bind=SUPER,Return,spawn,exo-open --launch TerminalEmulator
bind=CTRL+ALT,t,spawn,exo-open --launch TerminalEmulator
bind=SUPER+CTRL,t,spawn,exo-open --launch TerminalEmulator btop
bind=SUPER+SHIFT,Return,spawn,exo-open --launch WebBrowser
bind=SUPER+SHIFT,b,spawn,exo-open --launch WebBrowser
bind=SUPER+SHIFT+ALT,b,spawn,firefox --private-window
bind=SUPER,e,spawn,thunar
bind=SUPER+SHIFT,f,spawn,exo-open --launch FileManager
bind=CTRL+ALT,f,spawn,thunar
bind=SUPER+SHIFT,n,spawn,mousepad
bind=SUPER,space,spawn,xfce4-appfinder
bind=SUPER,r,spawn,xfce4-appfinder -c
bind=ALT,F2,spawn,xfce4-appfinder --collapsed
bind=ALT,F3,spawn,xfce4-appfinder
bind=SUPER+ALT,space,spawn,xfce4-popup-applicationsmenu
bind=ALT,F1,spawn,xfce4-popup-applicationsmenu
bind=SUPER+CTRL,a,spawn,pavucontrol
bind=SUPER+CTRL,b,spawn,blueman-manager
bind=SUPER+CTRL,d,spawn,xfce4-display-settings
bind=SUPER,p,spawn,xfce4-display-settings --minimal
bind=SUPER+CTRL,p,spawn,xfce4-power-manager-settings
bind=SUPER+CTRL,v,spawn,xfce4-popup-clipman
bind=SUPER+CTRL,w,spawn,nm-connection-editor
bind=CTRL+SHIFT,Escape,spawn,xfce4-taskmanager
# Omarchy's Super+K: the table of shortcuts, read from this file (~/.local/bin/mango-keys); again to close it.
bind=SUPER,k,spawn_shell,exec "$HOME/.local/bin/mango-keys"
bind=SUPER,Escape,spawn,xfce4-session-logout
# Omarchy: close all windows. Here, as in labwc, Xfce's log out (which asks).
bind=CTRL+ALT,Delete,spawn,xfce4-session-logout
bind=NONE,Print,spawn,xfce4-screenshooter -f
bind=SHIFT,Print,spawn,xfce4-screenshooter -r
bind=CTRL,Print,spawn,xfce4-screenshooter -w

# Layout of the workspace: dwindle ↔ scroller (Omarchy: Super+L, and Super+Alt+L back).
bind=SUPER,l,switch_layout
bind=SUPER+ALT,l,switch_layout

# Windows.
bind=SUPER,w,killclient
bind=SUPER,q,killclient
bind=ALT,F4,killclient
# Omarchy's "toggle split": the focused window and its pair side by side ↔ one above the other.
# (dwindle_toggle_split_direction only sets the next split with dwindle_manual_split=1: it did nothing here.)
bind=SUPER,j,dwindle_toggle_current_split
bind=SUPER,t,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER+CTRL,f,togglefakefullscreen
bind=SUPER+ALT,f,togglemaximizescreen
bind=ALT,F11,togglefullscreen
bind=ALT,F10,togglemaximizescreen
# Omarchy: pop out (float + pin to every workspace).
bind=SUPER,o,toggleglobal
bind=SUPER+SHIFT,space,set_proportion,1.0
bind=SUPER+SHIFT,r,switch_proportion_preset
bind=SUPER,m,minimized
bind=SUPER+SHIFT,m,restore_minimized

# Focus, and swapping with the neighbour.
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

# Resizing: Omarchy's two keys right of 0 (code:20, code:21; on latam ' and ¿, on us - and =, as in Omarchy): width with Super, height with
# Super+Shift; Alt = a little, Ctrl = a lot.
bind=SUPER,code:20,resizewin,-100,+0
bind=SUPER,code:21,resizewin,+100,+0
bind=SUPER+SHIFT,code:20,resizewin,+0,-100
bind=SUPER+SHIFT,code:21,resizewin,+0,+100
bind=SUPER+ALT,code:20,resizewin,-25,+0
bind=SUPER+ALT,code:21,resizewin,+25,+0
bind=SUPER+CTRL,code:20,resizewin,-300,+0
bind=SUPER+CTRL,code:21,resizewin,+300,+0

# Workspaces 1–9. Super+Shift+N takes the window there; with Alt, it stays here.
# Shared by all monitors, as in xfwm4: the last 1 (synctag) switches every monitor to that workspace. mango still
# keeps nine per monitor; they just move together (a window stays on its monitor's workspace N).
bind=SUPER,code:10,view,1,1
bind=SUPER,code:11,view,2,1
bind=SUPER,code:12,view,3,1
bind=SUPER,code:13,view,4,1
bind=SUPER,code:14,view,5,1
bind=SUPER,code:15,view,6,1
bind=SUPER,code:16,view,7,1
bind=SUPER,code:17,view,8,1
bind=SUPER,code:18,view,9,1
bind=SUPER+SHIFT,code:10,tag,1,1
bind=SUPER+SHIFT,code:11,tag,2,1
bind=SUPER+SHIFT,code:12,tag,3,1
bind=SUPER+SHIFT,code:13,tag,4,1
bind=SUPER+SHIFT,code:14,tag,5,1
bind=SUPER+SHIFT,code:15,tag,6,1
bind=SUPER+SHIFT,code:16,tag,7,1
bind=SUPER+SHIFT,code:17,tag,8,1
bind=SUPER+SHIFT,code:18,tag,9,1
bind=SUPER+SHIFT+ALT,code:10,tagsilent,1
bind=SUPER+SHIFT+ALT,code:11,tagsilent,2
bind=SUPER+SHIFT+ALT,code:12,tagsilent,3
bind=SUPER+SHIFT+ALT,code:13,tagsilent,4
bind=SUPER+SHIFT+ALT,code:14,tagsilent,5
bind=SUPER+SHIFT+ALT,code:15,tagsilent,6
bind=SUPER+SHIFT+ALT,code:16,tagsilent,7
bind=SUPER+SHIFT+ALT,code:17,tagsilent,8
bind=SUPER+SHIFT+ALT,code:18,tagsilent,9
# Omarchy's Super+0 is workspace 10; mango has nine (tag_num=10 is refused): Super+0 does nothing. Not mango's
# overview (toggleoverview): in the session, on 2026-10-23, it crashed mango (segmentation fault) and the whole
# session with it; nested it had worked.
bind=SUPER,Tab,viewtoright,1
bind=SUPER+SHIFT,Tab,viewtoleft,1
bind=CTRL+ALT,Left,viewtoleft,1
bind=CTRL+ALT,Right,viewtoright,1

# Scratchpad (Omarchy: Super+S shows it, Super+Alt+S sends the window): mango's is made of minimized windows.
# mango's toggle_scratchpad shows them one at a time, in its order; mango-scratchpad brings the one you choose.
bind=SUPER,s,spawn_shell,exec "$HOME/.local/bin/mango-scratchpad"
bind=SUPER+ALT,s,minimized

# Monitors (the Legion with its monitor).
bind=CTRL+ALT,Tab,focusmon,right
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right

# Volume and brightness (as in labwc: wpctl, and brightness through elogind).
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn_shell,exec "$HOME/.local/bin/brightness" +10
bind=NONE,XF86MonBrightnessDown,spawn_shell,exec "$HOME/.local/bin/brightness" -10

# Mouse: Super+drag moves, Super+right drag resizes; Super+wheel changes workspace.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft,1
axisbind=SUPER,DOWN,viewtoright,1
