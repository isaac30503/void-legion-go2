# systemd-compat — the units of void-legion-go2 (installed by common/systemd-compat/install-systemd-compat.sh;
# docs/2-base-system/4-systemd-compat.md). This file is replaced on every installation: your own units go in
# another file of this folder (e.g. 90-local.conf), read after this one (the last matching line wins).
#
# One unit per line:   NAME  SCOPE  KIND …
#   NAME   the unit without ".service"; it may be a pattern (hhd@*)
#   SCOPE  system | user
#   KIND   runit SERVICE [log=FILE]  a system unit that is that runit service (/etc/sv/SERVICE); journalctl -u reads
#                                    FILE (default /var/log/SERVICE/current, written by svlogd)
#          exec COMMAND…             a unit that runs COMMAND (a line of sh) as a process of the caller's session
#                                    (user scope) or of root (system scope); systemctl starts, stops and watches it
#          deny                      the unit does not exist, even if a runit service has that name
# Runit services need no line: /etc/sv/<name> answers as <name>.service by itself.

# Decky Loader: on SteamOS its unit is plugin_loader.service (Hooandee's plugins restart it after updating themselves)
plugin_loader   system  runit  decky  log=/var/log/decky/current

# PipeWire's filter-chain: SteamOS has it as a user unit (/usr/lib/systemd/user/filter-chain.service, the same command);
# Panel de Control's equalizer writes ~/.config/pipewire/filter-chain.conf.d/pdc-eq.conf and restarts it
filter-chain    user    exec   pipewire -c filter-chain.conf

# HHD (Handheld Daemon, Bazzite's controller manager): Panel de Control asks for it on every start to choose between
# HHD and InputPlumber. It does not exist here on purpose (InputPlumber is the one): "deny" answers the same
# "inactive" and keeps those questions out of requests.log, so they are not news in "void-update --systemd"
hhd             system  deny
hhd@*           system  deny
hhd_local@*     system  deny
