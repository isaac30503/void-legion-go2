# Sources: drivers/platform/x86/lenovo/wmi-*.{c,h} and firmware_attributes_class.h of the stable kernel
# v6.18.55 (git.kernel.org), unchanged. Only for 6.18 (in another series the API may change).
PACKAGE_NAME="lenovo-wmi-tdp"
PACKAGE_VERSION="6.18.55"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILD_EXCLUSIVE_KERNEL="^6\.18\."
AUTOINSTALL="yes"
BUILT_MODULE_NAME[0]="lenovo-wmi-helpers"
BUILT_MODULE_LOCATION[0]="lenovo/"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="lenovo-wmi-events"
BUILT_MODULE_LOCATION[1]="lenovo/"
DEST_MODULE_LOCATION[1]="/updates"
BUILT_MODULE_NAME[2]="lenovo-wmi-capdata01"
BUILT_MODULE_LOCATION[2]="lenovo/"
DEST_MODULE_LOCATION[2]="/updates"
BUILT_MODULE_NAME[3]="lenovo-wmi-other"
BUILT_MODULE_LOCATION[3]="lenovo/"
DEST_MODULE_LOCATION[3]="/updates"
BUILT_MODULE_NAME[4]="lenovo-wmi-gamezone"
BUILT_MODULE_LOCATION[4]="lenovo/"
DEST_MODULE_LOCATION[4]="/updates"
