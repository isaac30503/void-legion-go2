# ~/.config/fuzzel/fuzzel.ini (Legion, 2026-10-06; recipe, step 14, "Discord (Vesktop)").
# fuzzel here is only the "what to share" chooser of xdg-desktop-portal-wlr (screen sharing in
# Vesktop and other apps): it finds it by itself (chooser_type default) and passes it the list of screens and windows.
# It is the fallback: the normal chooser is legion/screen-share/screen-share.
# Colors of the bottom panel (#212121) and Orchis's teal accent; corners like the panel.
# (The prompt was "Compartir: " in the Spanish original; fuzzel.ini has no translations.)
[main]
font=JetBrainsMono Nerd Font:size=11
prompt="Share: "
width=70
lines=10
horizontal-pad=16
vertical-pad=12
inner-pad=8

[colors]
background=212121f2
text=e0e0e0ff
prompt=26a69aff
input=ffffffff
match=26a69aff
selection=26a69aff
selection-text=ffffffff
selection-match=ffffffff
border=26a69aff

[border]
width=2
radius=12
