## Session priority (which device is chosen by default) for audio output and
## input. Higher priority.session/priority.driver = more preferred.
## Generated by the fish function audio-priority -- dynamic detection via
## pw-dump (python3), see the function's header comment for the detail.
##
## Requires node.restore-default-targets=false so that the priority always rules
## instead of remembering the last device used -- this function
## reasserts it every time it runs, in case something resets it.
##
## (Legion copy, Legion recipe, list K.12. The device descriptions are PipeWire's, shown here in
## English; on the Spanish system they read "Estéreo analógico", "Estéreo digital (HDMI)" and
## "(conectado)". @UGREEN_MIC_SERIAL@ and @HEADPHONES_BT_MAC@ come from local.env when it is installed.)

monitor.alsa.rules = [
  {
    ## UGREEN USB MIC-CM581 Analog Stereo (connected)
    matches = [ { node.name = "alsa_output.usb-JinAudio_UGREEN_USB_MIC-CM581_@UGREEN_MIC_SERIAL@-00.analog-stereo" } ]
    actions = {
      update-props = {
        priority.session = 5000
        priority.driver  = 5000
      }
    }
  }
  {
    ## HD-Audio Generic Digital Stereo (HDMI) [MAG 276CF E20] (connected)
    matches = [ { node.name = "alsa_output.pci-0000_c2_00.1.hdmi-stereo" } ]
    actions = {
      update-props = {
        priority.session = 6000
        priority.driver  = 6000
      }
    }
  }
  {
    ## Family 17h/19h HD Audio Controller Analog Stereo (connected)
    matches = [ { node.name = "alsa_output.pci-0000_c2_00.6.analog-stereo" } ]
    actions = {
      update-props = {
        priority.session = 7000
        priority.driver  = 7000
      }
    }
  }
  {
    ## Family 17h/19h HD Audio Controller Analog Stereo (connected)
    matches = [ { node.name = "alsa_input.pci-0000_c2_00.6.analog-stereo" } ]
    actions = {
      update-props = {
        priority.session = 6000
        priority.driver  = 6000
      }
    }
  }
  {
    ## UGREEN USB MIC-CM581 Analog Stereo (connected)
    matches = [ { node.name = "alsa_input.usb-JinAudio_UGREEN_USB_MIC-CM581_@UGREEN_MIC_SERIAL@-00.analog-stereo" } ]
    actions = {
      update-props = {
        priority.session = 7000
        priority.driver  = 7000
      }
    }
  }
]

monitor.bluez.rules = [
  {
    ## METHOD 360 ANC (connected)
    matches = [ { node.name = "bluez_output.@HEADPHONES_BT_MAC@.1" } ]
    actions = {
      update-props = {
        priority.session = 8000
        priority.driver  = 8000
      }
    }
  }
  {
    ## METHOD 360 ANC (connected)
    matches = [ { node.name = "bluez_input.@HEADPHONES_BT_MAC@" } ]
    actions = {
      update-props = {
        priority.session = 5000
        priority.driver  = 5000
      }
    }
  }
]
